spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  application:
    name: ai-passage-creator
  profiles:
    active: local
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: 123456
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.template.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# Pexels API 配置
pexels:
  api-key: ${PEXELS_API_KEY:xxx}
# Nano Banana (Gemini 原生图片生成) 配置
nano-banana:
  api-key: ${GEMINI_API_KEY:${IMAGE_MODEL_API_KEY:}}
  model: ${GEMINI_MODEL:${IMAGE_MODEL:gemini-3.1-flash-image}}
  base-url: ${GEMINI_BASE_URL:${IMAGE_MODEL_BASE_URL:https://generativelanguage.googleapis.com}}
  image-size: ${GEMINI_IMAGE_SIZE:1K}
  aspect-ratio: ${GEMINI_ASPECT_RATIO:16:9}
  timeout-seconds: ${IMAGE_TIMEOUT_SECONDS:120}
doubao:
  api-key: ${DOUBAO_API_KEY:}
  model: ${DOUBAO_MODEL:}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  image-size: ${DOUBAO_IMAGE_SIZE:2K}
  timeout-seconds: ${IMAGE_TIMEOUT_SECONDS:120}

# Mermaid 图表生成配置
mermaid:
  cli-command: mmdc  # CLI 命令（Windows 下会自动使用 mmdc.cmd）
  background-color: transparent  # 背景颜色
  output-format: svg  # 输出格式（svg/png/pdf）
  width: 1200  # 图片宽度（像素）
  timeout: 30000  # 命令执行超时时间（毫秒）

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""  # 留空使用 currentColor，或设置如 "#000000"

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000  # 请求超时（毫秒）

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams  # COS 存储文件夹

# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10

models:
  master-key-dir: ${MODEL_MASTER_KEY_DIR:./data/model-secrets}
  admin:
    origin: ${MODEL_ADMIN_ORIGIN:http://localhost}
    trust-private-proxy: ${MODEL_ADMIN_TRUST_PRIVATE_PROXY:false}
